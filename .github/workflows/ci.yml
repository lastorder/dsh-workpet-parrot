name: CI

# Runs `pnpm run verify` (syntax check + smoke test) on every push to the
# default branch and every pull request, so a break is found at the commit
# that caused it rather than at release time.
on:
  push:
    branches:
      - main
  pull_request:

# Read-only: nothing here publishes, tags, or writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Plain JavaScript with no build step; the matrix catches a
        # `node:test` or syntax-check behavior change early. 22 is the lowest
        # version `engines` allows, 24 is Active LTS, 26 is Current.
        node-version: ['22', '24', '26']
    name: verify (Node ${{ matrix.node-version }})
    steps:
      - name: Check out the commit
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (syntax check + test)
        run: pnpm run verify
