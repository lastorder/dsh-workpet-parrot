name: Release

# Triggered by pushing an annotated tag matching v*.*.*: verify, stage the
# package on npm, and create a matching GitHub Release marked as a
# pre-release until a maintainer approves the npm stage.
#
# The npm Trusted Publisher is configured stage-only (no "publish directly"
# permission), so `npm publish` from this workflow is rejected — only
# `npm stage publish` is accepted. A maintainer must approve the staged
# version on npmjs.com (or with `npm stage approve`, 2FA) before it becomes
# installable. Even a compromised workflow can only reach the stage queue,
# never the registry, without a human's 2FA approval.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # to create the GitHub Release and upload its tarball asset
  id-token: write # to mint the OIDC token npm's Trusted Publishing exchanges for a stage credential

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (syntax check + test)
        run: pnpm run verify

      - name: Check the tag matches package.json's version
        # A mismatch means the tag was cut against the wrong commit or the
        # version was never bumped; fail before anything is staged.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Stage on npm
        # No token: the package has a Trusted Publisher (npmjs.com package
        # Settings -> Trusted Publisher -> GitHub Actions ->
        # lastorder/dsh-workpet-parrot + .github/workflows/release.yml),
        # restricted to stage-only. npm CLI >= 11.15.0 exchanges this job's
        # OIDC token for a short-lived, workflow-scoped stage credential.
        # The package ships plain JS as written; `prepublishOnly`
        # (`pnpm run verify`) still runs as part of `npm stage publish`.
        run: |
          npm install -g npm@latest
          npm stage publish

      - name: Pack a tarball for the GitHub Release
        run: npm pack --ignore-scripts

      - name: Read the release notes from the tagged commit
        # Release commits are written as standalone release notes
        # ("Release vX.Y.Z: <summary>" plus a prose body); reuse that message.
        id: release_notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            git log -1 --format=%B "$GITHUB_SHA"
            echo ''
            echo '---'
            echo ''
            echo '⚠️ Staged on npm, awaiting maintainer approval before it installs — see https://www.npmjs.com/package/dsh-workpet-parrot?activeTab=versions or run `npm stage ls`.'
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release (marked pre-release until npm approval)
        # Pinned to a full commit SHA: this third-party action runs in a job
        # holding `contents: write` and `id-token: write`, so a moved tag on
        # its repository would be a direct path into this release pipeline.
        # First-party actions/* and pnpm/* steps stay on major tags.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.release_notes.outputs.body }}
          files: '*.tgz'
          prerelease: true
